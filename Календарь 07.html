<body>
<div class="calendar-container">
    <div class="calendar-header">
        <div class="title">📅 Календарь смен дяди Кости</div>
        <div class="subtitle">⚡ 2 в день · 2 в ночь · 2 вых-ых ⚡</div>
    </div>

    <div class="month-navigation">
        <button class="nav-btn" id="prevMonthBtn" aria-label="Предыдущий месяц">◀</button>
        <span class="month-label" id="monthLabel">Сентябрь 2026</span>
        <button class="nav-btn" id="nextMonthBtn" aria-label="Следующий месяц">▶</button>
    </div>

    <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="legend">
        <div class="legend-item"><span class="legend-dot dot-day"></span> Дневная</div>
        <div class="legend-item"><span class="legend-dot dot-night"></span> Ночная</div>
        <div class="legend-item"><span class="legend-dot dot-off"></span> Вых-ой</div>
    </div>

    <div class="footer-note">
        ✨ Сегодня — вторая ночь, перед выходными ✨
    </div>
</div>

<script>
    (function() {
        const CYCLE_DAY = 0;
        const CYCLE_NIGHT = 1;
        const CYCLE_OFF = 2;

        // Точка отсчёта: 2 сентября 2026 — вторая ночь
        const BASE_DATE = new Date(2026, 7, 31); // 31 августа 2026 — второй день
        const BASE_CYCLE_POS = 1; // позиция в цикле 6: 0(день1), 1(день2), 2(ночь1), 3(ночь2), 4(вых1), 5(вых2)

        let currentYear = 2026;
        let currentMonth = 8; // сентябрь (0-индекс)

        function getShiftForDate(date) {
            const baseDay = new Date(BASE_DATE.getFullYear(), BASE_DATE.getMonth(), BASE_DATE.getDate());
            const targetDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffTime = targetDay - baseDay;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            const cyclePos = ((diffDays + BASE_CYCLE_POS) % 6 + 6) % 6;
            
            if (cyclePos === 0 || cyclePos === 1) return CYCLE_DAY;
            else if (cyclePos === 2 || cyclePos === 3) return CYCLE_NIGHT;
            else return CYCLE_OFF;
        }

        function getShiftLabel(shift) {
            if (shift === CYCLE_DAY) return 'День';
            if (shift === CYCLE_NIGHT) return 'Ночь';
            return 'Вых-ой';
        }

        function getShiftClass(shift) {
            if (shift === CYCLE_DAY) return 'shift-day';
            if (shift === CYCLE_NIGHT) return 'shift-night';
            return 'shift-off';
        }

        function isToday(date) {
            const today = new Date();
            return date.getFullYear() === today.getFullYear() &&
                   date.getMonth() === today.getMonth() &&
                   date.getDate() === today.getDate();
        }

        function formatMonthLabel(year, month) {
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            return `${monthNames[month]} ${year}`;
        }

        function renderCalendar(year, month) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            document.getElementById('monthLabel').textContent = formatMonthLabel(year, month);

            const firstDayOfMonth = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstWeekday = firstDayOfMonth.getDay();
            firstWeekday = (firstWeekday === 0) ? 6 : firstWeekday - 1; // Пн=0

            for (let i = 0; i < firstWeekday; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty-day';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const shift = getShiftForDate(dateObj);
                const shiftLabel = getShiftLabel(shift);
                const shiftClass = getShiftClass(shift);

                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                if (isToday(dateObj)) {
                    dayCell.classList.add('today-ring');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;

                const shiftBadge = document.createElement('div');
                shiftBadge.className = `shift-badge ${shiftClass}`;
                shiftBadge.textContent = shiftLabel;

                const shiftInfo = document.createElement('div');
                shiftInfo.className = 'shift-info';
                shiftInfo.appendChild(shiftBadge);

                dayCell.appendChild(dayNumber);
                dayCell.appendChild(shiftInfo);
                grid.appendChild(dayCell);
            }
        }

        document.getElementById('prevMonthBtn').addEventListener('click', function() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('nextMonthBtn').addEventListener('click', function() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar(currentYear, currentMonth);
        });

        renderCalendar(currentYear, currentMonth);
    })();
</script>
</body>
</html>
